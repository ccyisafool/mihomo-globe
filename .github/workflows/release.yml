name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run lint

      - name: Build OpenWrt release
        run: npm run release

      - name: Publish private release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/mihomo-globe.tar.gz \
            release/mihomo-globe.tar.gz.sha256 \
            release/install.sh \
            --verify-tag \
            --generate-notes \
            --title "Mihomo Globe $GITHUB_REF_NAME"
